name: Exact certificate checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exact checks and corruption rejection
        run: python3 -B checkers/verify.py --output work/verification.json
      - name: Deterministic certificate regeneration
        run: python3 -B tools/regenerate.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-python-${{ matrix.python }}
          path: work/verification.json
